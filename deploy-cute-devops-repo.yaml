---
- name: Deploy the local bare git repos and shared work directories
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars:
    repos:
      - name: cute-devops
        path: /srv/repos/cute-devops.git
        group: devops
        owner: root
        description: "Cute DevOps Patterns! — Ansible roles + patterns. https://cute-devops.patterns.how"
        remotes:
          - name: github
            url: git@github.com:mkbrechtel/cute-devops.git
            auto_push: true
          - name: codeberg
            url: ssh://git@codeberg.org/mkbrechtel/cute-devops.git
            auto_push: true
          - name: gitlab
            url: git@gitlab.com:idcohorts/cute-devops.git
            auto_push: false
          - name: osahris
            url: git@github.com:osahris/cute-devops.git
            auto_push: false
      - name: pod
        path: /srv/repos/pod.git
        group: devops
        owner: root
        description: "System deployment for devio — push to main triggers deploy@pod."
        remotes:
          - name: origin
            url: git@github.com:mkbrechtel/pod.git
    worktrees:
      - name: cute-devops
        repo: /srv/repos/cute-devops.git
        group: devops
        owner: root
        description: "Cute DevOps Patterns! — Ansible roles + patterns. https://cute-devops.patterns.how"
  roles:
    - role: git_hooks
    - role: repos
    - role: worktrees
    - role: claude_code
      vars:
        # This host keeps its worktrees under /work, and the fleet view
        # (`claude agents`) silently refuses to run the worktree hooks from a
        # directory the user has not trusted. The role defaults the trust hook
        # to off because it writes to user config; here it is wanted, and
        # naming it in the standing deploy is what keeps a convergence run from
        # removing what an ad-hoc run put there.
        claude_code_with_trust_work_dirs: true
        claude_code_trust_work_bases:
          - /work
