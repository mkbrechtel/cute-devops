---

- name: Write the portal vhost
  ansible.builtin.template:
    src: caddy-vhost.j2
    dest: "{{ authelia_caddy_conf_dir }}/{{ authelia_vhost }}"
    owner: root
    group: "{{ authelia_caddy_conf_group }}"
    mode: "{{ authelia_caddy_conf_mode }}"
  notify: reload caddy

- name: Write the forward-auth snippet
  ansible.builtin.template:
    src: caddy-snippet.j2
    dest: "{{ authelia_caddy_conf_dir }}/_snippet.authelia"
    owner: root
    group: "{{ authelia_caddy_conf_group }}"
    mode: "{{ authelia_caddy_conf_mode }}"
  notify: reload caddy
