---

- name: Create the authelia system user
  ansible.builtin.user:
    name: authelia
    system: true
    home: "{{ authelia_data_dir }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the socket access group
  ansible.builtin.group:
    name: "{{ authelia_socket_group }}"
    system: true

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ authelia_release_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ authelia_config_dir }}", owner: root, group: authelia, mode: "0750" }
    - { path: "{{ authelia_config_dir }}/conf.d", owner: root, group: authelia, mode: "0750" }
    - { path: "{{ authelia_data_dir }}", owner: authelia, group: authelia, mode: "0750" }
    - { path: "{{ authelia_secrets_dir }}", owner: root, group: authelia, mode: "0750" }
  loop_control:
    label: "{{ item.path }}"

- name: Read the pinned checksum
  ansible.builtin.set_fact:
    authelia_expected_checksum: >-
      {{ lookup('file', 'releases/download/' ~ authelia_version ~ '/checksums.sha256').splitlines()
         | select('search', authelia_tarball ~ '$')
         | first | split() | first }}

- name: Download the release tarball
  ansible.builtin.get_url:
    url: "{{ authelia_download_url }}"
    dest: "{{ authelia_release_dir }}/{{ authelia_tarball }}"
    checksum: "sha256:{{ authelia_expected_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Unpack the binary
  ansible.builtin.unarchive:
    src: "{{ authelia_release_dir }}/{{ authelia_tarball }}"
    dest: "{{ authelia_release_dir }}"
    remote_src: true
    include: [authelia]
    creates: "{{ authelia_binary }}"
    owner: root
    group: root
    mode: "0755"

- name: Link the current release
  ansible.builtin.file:
    src: "{{ authelia_binary }}"
    dest: /usr/local/bin/authelia
    state: link
  notify: restart authelia
