---

- name: Install authelia
  ansible.builtin.import_tasks: install.yaml

- name: Provision secrets
  ansible.builtin.import_tasks: secrets.yaml

- name: Configure authelia
  ansible.builtin.import_tasks: configure.yaml

- name: Publish the portal vhost
  ansible.builtin.import_tasks: caddy.yaml
  when: authelia_configure_caddy
