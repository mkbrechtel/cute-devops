---

# Interim until the secrets role exists: random secrets generated once on
# the host, at the path the secrets role will own.
- name: Generate secrets
  ansible.builtin.shell: >-
    set -o pipefail;
    umask 027;
    /usr/local/bin/authelia crypto rand --length 64 --charset alphanumeric
    | sed 's/^Random Value: //' > {{ authelia_secrets_dir }}/{{ item }}.pass
  args:
    creates: "{{ authelia_secrets_dir }}/{{ item }}.pass"
    executable: /bin/bash
  loop: "{{ authelia_generated_secrets }}"

- name: Generate the OIDC issuer key
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/authelia crypto pair rsa generate --bits 2048
      --directory {{ authelia_secrets_dir }}
      --file.private-key oidc-issuer.privkey.pem
      --file.public-key oidc-issuer.pubkey.pem
    creates: "{{ authelia_secrets_dir }}/oidc-issuer.privkey.pem"

- name: Write the SMTP password
  ansible.builtin.copy:
    content: "{{ authelia_smtp_password }}"
    dest: "{{ authelia_secrets_dir }}/smtp-password.pass"
    owner: root
    group: authelia
    mode: "0640"
  when: authelia_notifier == 'smtp' and authelia_smtp_password | length > 0
  no_log: true

- name: Fix secret permissions
  ansible.builtin.file:
    path: "{{ authelia_secrets_dir }}/{{ item }}"
    owner: root
    group: authelia
    mode: "0640"
  loop: "{{ authelia_generated_secrets | map('regex_replace', '$', '.pass') | list + ['oidc-issuer.privkey.pem'] }}"
  notify: restart authelia
