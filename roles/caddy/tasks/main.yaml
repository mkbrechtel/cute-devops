---

# The collection used to ship an apache role; a host that ran it still has
# apache2 on :80/:443, where Caddy needs to listen.
- name: Stop apache2
  ansible.builtin.systemd:
    name: apache2
    state: stopped
    enabled: false
  failed_when: false
  when: caddy_remove_apache

- name: Remove apache2
  ansible.builtin.apt:
    name: apache2
    state: absent
    purge: true
  when: caddy_remove_apache

- name: Install caddy from Debian
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Install the upstream caddy binary with DNS modules
  ansible.builtin.import_tasks: upstream.yaml
  when: caddy_dns_modules | length > 0

- name: Create the socket access group
  ansible.builtin.group:
    name: "{{ caddy_socket_group }}"
    system: true

- name: Let caddy read web-service sockets
  ansible.builtin.user:
    name: caddy
    groups: "{{ caddy_socket_group }}"
    append: true
  notify: restart caddy

- name: Create the vhost fragment directory
  ansible.builtin.file:
    path: "{{ caddy_conf_dir }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: caddy validate --adapter caddyfile --config %s
  notify: reload caddy

- name: Create the systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    mode: "0755"

- name: Write the systemd drop-in
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    mode: "0644"
  notify: restart caddy

- name: Enable and start caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true
