---
# Where the hook scripts land on the host.
claude_code_hooks_dir: /etc/claude/hooks
# The managed-settings drop-in that wires the hooks up machine-wide. Claude
# Code merges /etc/claude-code/managed-settings.d/*.json alphabetically into
# /etc/claude-code/managed-settings.json; a drop-in composes with other policy
# instead of owning the whole file.
claude_code_managed_settings_dropin: /etc/claude-code/managed-settings.d/50-cute-devops.json
# Deploy the Stop hook that blocks a session from ending while its worktree has
# uncommitted changes.
claude_code_with_require_clean: true
# Managed `worktree.bgIsolation` policy: whether background sessions must
# isolate into a worktree before editing. "none" pins isolation off
# machine-wide, "worktree" enforces it (the Shared Worktrees setup). Managed
# settings override user and project settings, so set this to false to omit
# the key and leave the choice to lower settings scopes instead.
claude_code_bg_isolation: none
# Deploy the SessionStart hook that marks the work base directories as
# trusted in the user's ~/.claude.json — trust is inherited from ancestors,
# so one trusted base covers every pad and worktree below it. The fleet view
# (`claude agents`) refuses to run worktree hooks from untrusted directories.
# Writes to user config, hence opt-in.
claude_code_with_trust_work_dirs: false
# Work base directories the trust hook marks as trusted.
claude_code_trust_work_bases:
  - /work
