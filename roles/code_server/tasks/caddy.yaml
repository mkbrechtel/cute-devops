---

- name: Write the vhost
  ansible.builtin.template:
    src: caddy-vhost.j2
    dest: "{{ code_server_caddy_conf_dir }}/{{ code_server_vhost }}"
    owner: root
    group: "{{ code_server_caddy_conf_group }}"
    mode: "{{ code_server_caddy_conf_mode }}"
  notify: reload caddy
