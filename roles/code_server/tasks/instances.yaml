---

- name: Create the socket access group
  ansible.builtin.group:
    name: "{{ code_server_socket_group }}"
    system: true

- name: PAM service for code-server sessions
  ansible.builtin.template:
    src: pam.j2
    dest: /etc/pam.d/code-server
    mode: "0644"

# Overrides the package's code-server@.service (which listens on TCP).
- name: Socket parent directory at boot
  ansible.builtin.template:
    src: tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/code-server.conf
    mode: "0644"
  register: code_server_tmpfiles

- name: Create it now  # noqa: no-handler
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/code-server.conf
  when: code_server_tmpfiles.changed

- name: Template unit
  ansible.builtin.template:
    src: code-server@.service.j2
    dest: /etc/systemd/system/code-server@.service
    mode: "0644"
  notify: restart code-server

- name: Enable lingering
  ansible.builtin.command: loginctl enable-linger {{ item }}
  args:
    creates: /var/lib/systemd/linger/{{ item }}
  loop: "{{ code_server_users }}"
  when: code_server_enable_linger

- name: Enable and start instances
  ansible.builtin.systemd:
    name: "code-server@{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ code_server_users }}"
