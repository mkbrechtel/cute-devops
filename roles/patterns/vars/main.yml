---
# The collection root, two levels up from roles/patterns/. This is what makes
# the role work both from a git checkout and from an installed collection —
# `patterns/` ships in the Galaxy artifact (it is not in galaxy.yml's
# build_ignore), so the content travels with the role either way.
patterns_src: "{{ role_path }}/../.."

# The trees mirrored to the host, each with its index file alongside.
patterns_trees:
  - patterns
  - anti-patterns
