---

- name: Install php-fpm
  ansible.builtin.apt:
    name: php-fpm
    state: present

- name: Find the php-fpm unit
  ansible.builtin.command: sh -c 'ls /usr/lib/systemd/system/php*-fpm.service | head -1'
  register: php_fpm_unit
  changed_when: false

- name: Enable and start php-fpm
  ansible.builtin.systemd:
    name: "{{ php_fpm_unit.stdout | basename }}"
    enabled: true
    state: started
