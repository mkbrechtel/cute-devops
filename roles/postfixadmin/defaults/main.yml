postfixadmin_mysql_host: localhost
postfixadmin_mysql_database: postfixadmin
postfixadmin_mysql_username: postfixadmin
# Served at https://<postfixadmin_server_name>/postfixadmin through Caddy;
# TLS is Caddy's.
postfixadmin_server_name: "{{ inventory_hostname }}"
postfixadmin_configure_caddy: true
postfixadmin_caddy_conf_dir: /etc/caddy/conf.d
postfixadmin_web_root: /var/www/postfixadmin
postfixadmin_php_fpm_socket: "{{ php_fpm_socket | default('/run/php/php-fpm.sock') }}"
