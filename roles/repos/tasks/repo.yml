---
- name: "Resolve per-repo facts for {{ repo.name | default(repo.path | basename) }}"
  ansible.builtin.set_fact:
    _repo_path: "{{ repo.path }}"
    _repo_group: "{{ repo.group | default(repos_default_group) }}"
    _repo_owner: "{{ repo.owner | default(repos_default_owner) }}"
    _repo_remotes: "{{ repo.remotes | default([]) }}"

- name: "Assert repo.path is absolute and ends in .git: {{ _repo_path }}"
  ansible.builtin.assert:
    that:
      - _repo_path is match('^/.+\.git/?$')
    fail_msg: "repo.path must be an absolute path ending in .git (got: {{ _repo_path }})"

- name: "Ensure parent directory exists for {{ _repo_path }}"
  ansible.builtin.file:
    path: "{{ _repo_path | dirname }}"
    state: directory
    mode: "0755"

- name: "Initialise bare git repository at {{ _repo_path }}"  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "git init --bare --shared=group {{ _repo_path }}"
  args:
    creates: "{{ _repo_path }}/HEAD"

- name: "Set repository description for {{ _repo_path }}"
  ansible.builtin.copy:
    content: "{{ repo.description | default(repo.name | default(repo.path | basename)) }}\n"
    dest: "{{ _repo_path }}/description"
    owner: "{{ _repo_owner }}"
    group: "{{ _repo_group }}"
    mode: "0644"

- name: "Configure remotes in {{ _repo_path }}"
  ansible.builtin.include_tasks: remotes.yml
  when: _repo_remotes | length > 0

# Auto-push is a global hook now (git_hooks role, reference-transaction.d/
# 50-autopush) driven purely by the per-remote autopush git config set
# above. Clear out per-repo copies templated by earlier versions.
- name: "Remove legacy per-repo auto-push hook in {{ _repo_path }}"
  ansible.builtin.file:
    path: "{{ _repo_path }}/hooks/reference-transaction"
    state: absent

- name: "Set group ownership across {{ _repo_path }}"
  ansible.builtin.file:
    path: "{{ _repo_path }}"
    state: directory
    owner: "{{ _repo_owner }}"
    group: "{{ _repo_group }}"
    recurse: true

- name: "Strip group-write on policy paths in {{ _repo_path }}"
  ansible.builtin.command:
    cmd: "chmod -R g-w {{ _repo_path }}/{{ item }}"
  loop:
    - hooks
    - config
    - description
  changed_when: false
