# Method to install ttyd: "download" fetches a pre-built binary from GitHub
ttyd_setup_method: download

# ttyd version to install (GitHub release tag, without leading "v")
ttyd_version: "1.7.7"

# GitHub repository URL
ttyd_github_repo_url: "https://github.com/tsl0922/ttyd"

# Architecture identifier used in the release asset filename
ttyd_arch: "{{ ttyd_arch_map[ansible_architecture] | default(ansible_architecture) }}"

# Download URLs
ttyd_binary_filename: "ttyd.{{ ttyd_arch }}"
ttyd_download_url: "{{ ttyd_github_repo_url }}/releases/download/{{ ttyd_version }}/{{ ttyd_binary_filename }}"
ttyd_checksums_url: "{{ ttyd_github_repo_url }}/releases/download/{{ ttyd_version }}/SHA256SUMS"

# Installation directory
ttyd_install_dir: "/opt/ttyd"

# Feature flags
ttyd_with_usr_local_bin_symlink: false

# --- per-user backends and the routed vhost ---

# Users that get a ttyd@<user> instance; default: every entry of `users`.
ttyd_users: "{{ users | default({}) | list }}"
# Shell and working directory for the terminal ("~" = the user's home).
ttyd_shell: /bin/bash
ttyd_cwd: "~"
# Each instance is a real logind session (PAM), so XDG_RUNTIME_DIR and
# rootless podman work; lingering keeps the user's services alive.
ttyd_enable_linger: true
ttyd_run_dir: /run/ttyd
ttyd_socket_group: https-socket-access

# Which identity the gate reports for a user maps to which unix account.
# Behind oauth2-proxy and an OIDC provider X-Auth-Request-User is the
# subject — opaque and stable, unlike a username — so the vhost resolves it
# through this map. Defaults to the local Authelia's identifiers (published
# by that role) plus each user's own name, which is what a local Authelia
# gate sends. Set explicitly when the provider runs on another host.
ttyd_user_ids: "{{ ttyd_user_ids_auto }}"

# The one vhost; the reverse proxy routes each request to its user.
ttyd_zone: "{{ domain }}"
ttyd_vhost: "terminal.{{ ttyd_zone }}"
# Caddy snippet that authenticates the vhost: oauth2-proxy-<instance>, or
# authelia for the direct gate.
ttyd_caddy_auth_snippet: oauth2-proxy-default
ttyd_configure_caddy: true
ttyd_caddy_conf_dir: /etc/caddy/conf.d
ttyd_caddy_conf_group: caddy
ttyd_caddy_conf_mode: "0640"
ttyd_caddy_reload_command: systemctl reload caddy
