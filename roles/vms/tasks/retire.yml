- name: "Stop web console for removed VM {{ vm_name }}"
  ansible.builtin.systemd_service:
    name: "websockify@{{ vm_name }}.service"
    state: stopped
    enabled: false
  failed_when: false

- name: "Stop removed VM {{ vm_name }}"
  ansible.builtin.systemd_service:
    name: "vm@{{ vm_name }}.service"
    state: stopped
    enabled: false

# The disk image under vms_disk_dir is kept.
- name: "Remove config of removed VM {{ vm_name }}"
  ansible.builtin.file:
    path: "/etc/vms/{{ vm_name }}.cfg"
    state: absent
