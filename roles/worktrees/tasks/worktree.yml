---
- name: "Resolve facts for {{ wt.name | default(wt.repo | basename) }}"
  ansible.builtin.set_fact:
    _wt_repo: "{{ wt.repo }}"
    _wt_slug: "{{ wt.name | default(wt.repo | basename | regex_replace('\\.git/?$', '')) }}"
    _wt_group: "{{ wt.group | default(worktrees_default_group) }}"
    _wt_owner: "{{ wt.owner | default(worktrees_default_owner) }}"
    _wt_categories: "{{ wt.categories | default(worktrees_default_categories) }}"

- name: "Assert wt.repo is an absolute path ending in .git: {{ _wt_repo }}"
  ansible.builtin.assert:
    that:
      - _wt_repo is match('^/.+\.git/?$')
    fail_msg: "wt.repo must be an absolute path to a bare repo ending in .git (got: {{ _wt_repo }})"

- name: "Assert the bare repo exists at {{ _wt_repo }}"
  ansible.builtin.stat:
    path: "{{ _wt_repo }}/HEAD"
  register: _wt_repo_head
  failed_when: not _wt_repo_head.stat.exists

- name: "Resolve work directory path for {{ _wt_slug }}"
  ansible.builtin.set_fact:
    _wt_workdir: "{{ wt.workdir | default([worktrees_base, _wt_slug] | path_join) }}"

- name: "Create work directory (3775: setgid + sticky + group write) at {{ _wt_workdir }}"
  ansible.builtin.file:
    path: "{{ _wt_workdir }}"
    state: directory
    owner: "{{ _wt_owner }}"
    group: "{{ _wt_group }}"
    mode: "3775"

- name: "Create category folders (same 3775 perms) under {{ _wt_workdir }}"
  ansible.builtin.file:
    path: "{{ _wt_workdir }}/{{ item }}"
    state: directory
    owner: "{{ _wt_owner }}"
    group: "{{ _wt_group }}"
    mode: "3775"
  loop: "{{ _wt_categories }}"

- name: "Read recorded work directory in {{ _wt_repo }}"  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "git --git-dir={{ _wt_repo }} config --default '' cute.workdir"
  register: _wt_recorded_workdir
  changed_when: false
  failed_when: false

- name: "Record work directory path into config of {{ _wt_repo }}"  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "git --git-dir={{ _wt_repo }} config cute.workdir {{ _wt_workdir }}"
  when: _wt_recorded_workdir.stdout | trim != _wt_workdir
  changed_when: true

- name: "Write .git lookup pad pointing at {{ _wt_repo }}"
  ansible.builtin.copy:
    content: "gitdir: {{ _wt_repo }}\n"
    dest: "{{ _wt_workdir }}/.git"
    owner: "{{ _wt_owner }}"
    group: "{{ _wt_group }}"
    mode: "0644"

- name: "Scaffold CLAUDE.md landing doc in {{ _wt_workdir }}"
  ansible.builtin.template:
    src: CLAUDE.md.j2
    dest: "{{ _wt_workdir }}/CLAUDE.md"
    owner: "{{ _wt_owner }}"
    group: "{{ _wt_group }}"
    mode: "0644"
    force: false

- name: "Scaffold README.md human guide in {{ _wt_workdir }}"
  ansible.builtin.template:
    src: README.md.j2
    dest: "{{ _wt_workdir }}/README.md"
    owner: "{{ _wt_owner }}"
    group: "{{ _wt_group }}"
    mode: "0644"
    force: false

# The Claude Code hooks used to be scaffolded into the pad's .claude/; they now
# live machine-wide in /etc/claude (claude_code role). Clear out old scaffolds
# so the same hooks don't fire twice.
- name: "Remove per-pad Claude hook scaffolding from {{ _wt_workdir }}"
  ansible.builtin.file:
    path: "{{ _wt_workdir }}/.claude/{{ item }}"
    state: absent
  loop:
    - hooks/worktree-create
    - hooks/worktree-remove
    - hooks/require-clean
    - settings.json

- name: "Drop now-empty .claude directories in {{ _wt_workdir }}"
  ansible.builtin.command:
    cmd: "rmdir --ignore-fail-on-non-empty {{ _wt_workdir }}/.claude/hooks {{ _wt_workdir }}/.claude"
  changed_when: false
  failed_when: false

# Claude Code will only switch a session straight from one worktree into
# another when the target sits under <git-common-dir>/.claude/worktrees; ours
# live in the shared work directory instead, so that switch is refused and a
# session has to ExitWorktree back to the pad between every hop.
#
# Pointing the path it looks for at the work directory satisfies it without
# moving anything: the worktrees stay where the WorktreeCreate hook puts them
# and keep their <category>/<branch> layout, and the same directory is simply
# also reachable under the name Claude Code expects.
- name: "Ensure {{ _wt_repo }}/.claude exists for the worktrees link"
  ansible.builtin.file:
    path: "{{ _wt_repo }}/.claude"
    state: directory
    owner: "{{ _wt_owner }}"
    group: "{{ _wt_group }}"
    mode: "0755"

- name: "Link {{ _wt_repo }}/.claude/worktrees at {{ _wt_workdir }}"
  ansible.builtin.file:
    path: "{{ _wt_repo }}/.claude/worktrees"
    src: "{{ _wt_workdir }}"
    state: link
    owner: "{{ _wt_owner }}"
    group: "{{ _wt_group }}"
    follow: false
