# General role topology: the coverage that used to live in test-in-vms.yaml,
# now on the container harness. One instance per role family on the shared
# network. See test/README.md for prerequisites and the iteration loop.
---
- name: Provision the test containers
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tasks:
    - name: Provision instances
      ansible.builtin.import_tasks: test/tasks/provision-instances.yaml
      vars:
        test_instances: "{{ groups['instances'] }}"

- name: Base configuration on every instance
  hosts: instances
  gather_facts: true
  roles:
    - role: common
      tags: common

- name: Test deploy roles
  hosts: setup_deploy
  gather_facts: true
  roles:
    - role: setup_deploy
      tags: deploy
    - role: test_deploy_ohai
      tags: deploy
    - role: test_deploy_fail
      tags: deploy

- name: Test devbox roles
  hosts: devboxes
  gather_facts: true
  roles:
    - role: ttyd
      tags: ttyd
      vars:
        ttyd_with_usr_local_bin_symlink: true

- name: Test knot nameserver role
  hosts: knot_nameservers
  gather_facts: true
  roles:
    - role: knot_nameserver
      tags: knot

- name: Test the forward-auth stack
  hosts: auth_gates
  gather_facts: true
  pre_tasks:
    # oauth2-proxy discovers the issuer over https at start; the test zone
    # has no DNS, so the portal name points back at the container.
    - name: Resolve the portal locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 auth.{{ domain }}"
        mode: "0644"
      tags: auth
  roles:
    - role: caddy
      tags: auth
    - role: authelia
      tags: auth
    - role: oauth2_proxy
      tags: auth
  tasks:
    - name: Check the stack answers
      ansible.builtin.import_tasks: test/tasks/check-forward-auth.yaml
      tags: auth
