# ⚠ USE THIS SPARINGLY.
#
# test-in-containers is the default test path (see test/README.md): it boots
# system containers in seconds and covers services, config, packages and
# systemd units. This playbook exists only for what a container genuinely
# cannot answer, because it owns no kernel of its own:
#
#   - boot / init configuration
#   - kernel and sysctl behaviour (a rootless container silently keeps the
#     host's values — e.g. sysctl_tweaks' inotify watch limit)
#   - firewall / netfilter rule sets
#   - storage, partitioning and filesystems
#   - firmware and microcode
#   - true multi-host networking a shared podman network can't model
#
# Everything else belongs in test-in-containers-roles.yaml. Adding a play
# here commits whoever runs the suite to keeping an incus daemon around, so
# check the container path really can't cover it first.
#
# Requires incus on the machine running this (unlike the container path).
---
- name: Provision the OS-level test VM
  hosts: vms
  gather_facts: false

  vars:
    incus_image: images:debian/13/cloud
    vm_memory: 2GiB
    vm_disk: 20GiB

  pre_tasks:
    - name: Ensure local incus VM is available
      delegate_to: localhost
      become: false
      community.general.lxd_container:
        url: unix:/var/lib/incus/unix.socket
        name: "{{ inventory_hostname }}"
        state: started
        source:
          type: image
          mode: pull
          server: https://images.linuxcontainers.org
          protocol: simplestreams
          alias: debian/13/cloud
        type: virtual-machine
        config:
          limits.memory: "{{ vm_memory }}"
        devices:
          root:
            path: /
            pool: default
            type: disk
            size: "{{ vm_disk }}"
        wait_for_container: true
        wait_for_ipv4_addresses: true
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

# `common` stays here as the base the OS-level roles sit on. It is also
# covered by test-in-containers-roles.yaml — the duplication is deliberate:
# the container run proves the config lands, this one proves it still does
# on a real kernel with a real init.
- name: Base configuration
  hosts: vms
  become: true
  roles:
    - role: common
      tags: common

- name: Test OS-level roles that need a real kernel
  hosts: os_level
  become: true
  roles:
    # Session retention is init configuration: the user-manager and
    # runtime-directory lifecycle it governs only behaves like production
    # under a real init with real logins.
    - role: logind
      tags: logind
    # A container cannot write a non-namespaced sysctl; only here does
    # setting the inotify watch limit actually mean anything.
    - role: sysctl_tweaks
      tags: sysctl
      vars:
        sysctl_tweaks_increase_maximum_inotify_user_watches: true
    # Owns /etc/resolv.conf, which podman bind-mounts into containers.
    - role: resolvconf
      tags: resolvconf
    - role: storage
      tags: storage
    - role: firmware
      tags: firmware
    - role: microcode
      tags: microcode
