---

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present

# A vhost gated by Authelia directly, as a service role would write it.
# Nothing listens on the app socket; the gate answers before it matters.
# (terminal.<domain> and code.<domain> come from the ttyd and code_server
# roles.)
- name: Write a directly gated test vhost
  ansible.builtin.copy:
    content: |
      direct.{{ domain }} {
          import authelia
          reverse_proxy unix//run/https/direct.{{ domain }}/http.sock
      }
    dest: /etc/caddy/conf.d/direct.{{ domain }}
    mode: "0640"
    group: caddy
  register: gated_vhost

- name: Reload caddy  # noqa: no-handler
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
  when: gated_vhost.changed

- name: Wait for the sockets
  ansible.builtin.wait_for:
    path: "{{ item }}"
    timeout: 60
  loop:
    - /run/https/auth.{{ domain }}/http.sock
    - /run/oauth2-proxy/default.sock
    - /run/ttyd/alice/http.sock
    - /run/code-server/alice/http.sock

- name: Ask Authelia for its OIDC discovery document  # noqa: command-instead-of-module
  ansible.builtin.command: >-
    curl -sf --resolve auth.{{ domain }}:443:127.0.0.1 -k
    https://auth.{{ domain }}/.well-known/openid-configuration
  register: discovery
  changed_when: false

- name: Ask the gates about an anonymous request  # noqa: command-instead-of-module
  ansible.builtin.command: >-
    curl -s -o /dev/null -w '%{http_code} %{redirect_url}'
    --resolve {{ item }}.{{ domain }}:443:127.0.0.1 -k https://{{ item }}.{{ domain }}/
  register: verdicts
  changed_when: false
  loop: [terminal, direct, code]

- name: The provider is up and both gates redirect to a login
  ansible.builtin.assert:
    that:
      - (discovery.stdout | from_json).issuer == 'https://auth.' ~ domain
      - "'email_verified' in (discovery.stdout | from_json).claims_supported"
      - verdicts.results[0].stdout is match('302 https://terminal.' ~ domain ~ '/oauth2/sign_in')
      - verdicts.results[1].stdout is match('302 https://auth.' ~ domain ~ '/')
      - verdicts.results[2].stdout is match('302 https://code.' ~ domain ~ '/oauth2/sign_in')
    fail_msg: "{{ verdicts.results | map(attribute='stdout') | list }}"
